      "conflicting_source_pages": {
        "13": "Тип\nЦель\nКому подходит\nСрок\nдействия\nКратность /\nпребывание\nКлючевые\nдокументы\nПриглашение /\nходатайство\nГде оформляется\nПродление\nСрок\nоформления\nКонс. сбор\n(ориентир)\nНаш сбор\nS Учебная\nОбучение\nСтуденты\nобразовательных\nорганизаций КР\nдо 90 к.д.\n>30 дн —\nмногокр.\nОбращение вуза +\nучредительные,\nаккредитация,\nналоговая справка;\nдля долгосрочной —\nВИЧ, 086/У, ОМС,\nдоговор с вузом\nДа — вуз\nПортал (как\nправило, ЛК вуза);\nможно в КР\nДалее —\nрезидент-\nкарта\n5 / 2 р.д.\n90 дн ≈$80\n[ПРОВЕРИТЬ]\n[РЕШЕНИЕ]\nSW1 Спец.\nтрудовая\nМонтаж, шеф-монтаж,\nремонт поставленного\nоборудования по\nконтракту\nКомандированные\nсотрудники\nиностранных юрлиц\nдо 60 к.д.,\nпродление до\n1 года\nМногокр.\nОбращение\nработодателя/\nгосоргана +\nучредительные,\nналоговая справка,\nинвойс,\nкомандировочное\nудостоверение,\nписьмо\nмиграционного\nоргана об\nосвобождении от\nразрешения на\nработу; долгосрочно\n— ВИЧ, 086/У, ОМС\nДа\nПортал; можно в КР\nДо 1 года\n(резидент-\nкарта)\n5 / 2 р.д.\n60 дн ≈$75\n$100\nSW2 Спец.\nтрудовая\nЖурналистика;\nблаготворительность;\nволонтёрство\nЖурналисты,\nкорреспонденты,\nсотрудники фондов,\nволонтёры\nдо 60 к.д.,\nпродление до\n1 года\nМногокр.\nАккредитация\n(журналисты),\nписьмо\nмиграционного\nоргана об\nосвобождении,\nобращение\nпринимающей\nорганизации +\nдоговор +\nобращение\nгосоргана (фонды/\nволонтёры);\nдолгосрочно — ВИЧ,\n086/У, ОМС\nДа — госорган/\nорганизация\nПортал; можно в КР\nДо 1 года\n5 / 2 р.д.\n60 дн ≈$75\n$100\nDN Цифровой\nкочевник\nИКТ, разработка ПО\nПо ходатайству\nгосоргана в сфере\nцифровизации или\nдержатели статуса\n«Digital nomad»\nдо 1 года\nМногокр.\nОбращение\nгосоргана +\nучредительные,\nсвидетельство,\nналоговая справка\nДа — госорган\nПортал; можно в КР\n—\n5 / 2 р.д.\n1 год ≈$225\n[ПРОВЕРИТЬ]\n[РЕШЕНИЕ]",
        "15": "Тип\nЦель\nКому подходит\nСрок\nдействия\nКратность /\nпребывание\nКлючевые\nдокументы\nПриглашение /\nходатайство\nГде оформляется\nПродление\nСрок\nоформления\nКонс. сбор\n(ориентир)\nНаш сбор\nD / O\nДипломатическая\n/ Служебная\nОфициальные визиты,\nработа в дипмиссиях\nи межд. организациях\nВладельцы\nдипломатических/\nслужебных паспортов\n90 дн / до 1\nгода / срок\nаккредитации\n—\nОбращение МИД\nиностранного\nгосударства,\nпосольства, межд.\nорганизации или\nгосоргана КР\nДипканалы\nКД МИД\n—\n—\nПо\nвзаимности\n[ПРОВЕРИТЬ]\nНе\nоформляем\nL Выездная\nВыезд после\nнарушения срока,\nотказа/аннулирования\nдокументов,\nокончания учёбы и\nт.п.\nНарушители и лица,\nутратившие основание\nпребывания\nдо 10 дн\nВыезд\nСкан паспорта,\nписьмо ОВД /\nмиграционного\nоргана / ГКНБ\nНет\nПортал / ВП МИД\n—\n5 / 2 р.д.\n$200 / $1 100\n/ $2 200 /\n+$1 100 за\nкаждый\nследующий\nгод\n[РЕШЕНИЕ]\nE Экстренная\nвыездная\nТяжёлая болезнь,\nкритическое\nсостояние\nПациенты\nдо 10 дн\nВыезд\nХодатайство органа\nздравоохранения +\nмедзаключение\nМинздрав\nПортал\n—\n—\nБесплатно\nНе\nоформляем\nЕР Единое\nразрешение\nТрудовая\nдеятельность: найм,\nИП\nВсе иностранцы,\nкроме граждан ЕАЭС\n(безвизовые — тоже)\nдо 60 дн\nПребывание\n+ работа\nХодатайство\nработодателя,\nобязательства,\nштатное расписание,\nучредительные\nдокументы,\nналоговая справка,\nскан паспорта и др.\n(блок 11)\nДа —\nработодатель\nчерез «Личный\nкабинет»\nПортал (ЛК\nработодателя);\nможно в КР\nДалее —\nрезидент-\nкарта\nдо 7 р.д.\n(срочно 5\nили 2)\n$75 +\nгоспошлина\n+\nгарантийный\nвзнос 5 000\nсом (блок\n12.3)\n$100\nРезидент-карта\nПребывание до 1 года\n(работа, учёба,\nвоссоединение с\nсемьёй)\nДержатели ЕР;\nвъехавшие по S, SW1,\nRL, FF; продлевающие\nпребывание сверх\nустановленного срока\nдо 1 года\nМногокр.\nПо основанию:\nтрудовой договор,\nВИЧ, 086/У, согласие\nна спецсчёт в банке\nи др.\nДа —\nприглашающая\nсторона\nПортал; в КР\nНовая ЕР за\n≥7 р.д. до\nокончания\n(для\nработающих)\n10 р.д.\n$225 + эл.\nразрешение\nна работу +\nвыпуск карты\nбанком\n$100\n(работа) /\n[РЕШЕНИЕ]",
        "82": "19.6. FF — семья иностранца\nШаг\nСпецифика\nСрок\nСтоимость\nКвалификация\nОсновной член семьи легально в КР (ЕР, РК, ВНЖ, виза O/I/SW/RL/S/DN,\nкайрылман, безвиз с регистрацией); кто едет (супруг, дети < 18, дети с\nинвалидностью, родители-иждивенцы)\n—\n—\nДокументы\nЗаявление основного члена семьи; документы родства (апостиль +\nперевод); документ о его легальном пребывании; ходатайство организации\n(если приглашает работодатель)\n3–10\nдней\n—\nПодача\nПортал / ЛК; каждому — своя заявка; можно изнутри КР\n5 / 2\nр.д.\n90 дн ≈ $90 (семье держателя I\n— бесплатно) + наш сбор\n[РЕШЕНИЕ]\nПосле\nПредупредить: работать нельзя; далее резидент-карта (ВИЧ, 086/У, ОМС)\n10 р.д.\n—\n19.7. S — учебная\nВуз подаёт через ЛК; мы координируем пакет студента. Документы вуза: письмо руководителя, учредительные,\nаккредитация, налоговая справка. Студенту для резидент-карты: ВИЧ, 086/У, ОМС, заверенная копия договора с вузом\n(срок обучения). Срок визы до 90 дн → резидент-карта. Стоимость: ≈ $80 за 90 дн [ПРОВЕРИТЬ]  + наш сбор [РЕШЕНИЕ] .\nНапоминания: −10 р.д. до окончания визы — резидент-карта; ежегодно — продление регистрации и РК.\n19.8. SW1 / SW2\nШаг\nSW1 (монтаж/ремонт)\nSW2 (журналисты, фонды, волонтёры)\nСторона\nИностранный работодатель-поставщик + госорган/заказчик КР\nГосорган (аккредитация) / принимающая\nорганизация КР\nКлючевые\nдокументы\nИнвойс, командировочное, письмо миграционного органа об\nосвобождении от разрешения на работу, налоговая справка,\nучредительные\nАккредитация; договор; обращение\nгосоргана; письмо об освобождении\nСрок визы\nДо 60 дн → до 1 года\nДо 60 дн → до 1 года\nСрок\nоформления\n5 / 2 р.д.\n5 / 2 р.д.\nСтоимость\n60 дн ≈ $75 + наш $100\n60 дн ≈ $75 + наш $100\nДолгосрочно\nВИЧ, 086/У, ОМС; резидент-карта\nТо же\n19.9. Работа: ЕР → резидент-карта (воронка «Работа»)\n№\nШаг\nМенеджер\nРаботодатель\nРаботник\nГосорган\nСрок\nСтоимость\nСтатус\nНапоминание\n1\nКвалификация\nЕАЭС? SW?\nпатент? ВКС?\nотрасль (ТПП)?\nналоги 3 мес.?\nДаёт данные\nДаёт паспорт\n—\n1 день\n—\nW01–\nW02\n—\n2\nКП, договор,\nоплата\nРасчёт:\nгосплатежи (12.3)\n+ наш $100/чел.\nПодписывает,\nплатит\n—\n—\n1–2 дня\n—\nW03–\nW04\n24/48 ч\n3\nЛК\nработодателя\nРегистрирует по\nдоверенности или\nинструктирует\nДокументы\nкомпании,\nдоверенность\n—\nМИД\nактивирует\nЛК\n[ПРОВЕРИТЬ]\n—\nW05–\nW06\n—\n4\nКвота\nПодаёт заявку:\nчисленность,\nгражданство,\nотрасль, налоги за\n3 мес.\n—\n—\nМИД\n[ПРОВЕРИТЬ]\n—\nW07–\nW08\nДедлайн\nиспользования\n+3 мес."
