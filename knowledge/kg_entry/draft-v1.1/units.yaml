    "blocked_value": {
      "applicability_source": "2.5. Особые режимы\nКто\nПравило\nИсточник\nГраждане КНР и Индии с долгосрочной (>3\nлет) визой США, Великобритании или\nШенгена\nБез визы 7 дней, повторный безвизовый въезд — через 21 день после\nвыезда\nП-541 п.15\nОрганизованные тургруппы граждан КНР (5–\n25 чел.) по ходатайству органа туризма\nБез визы до 21 дня, повтор — через 21 день; визы внутри КР не\nоформляют (кроме форс-мажора)\nП-541\nп.15-1\nПостоянные жители Гонконга и Макао\nБез визы 30 дней, повтор — через 30 дней; визы внутри КР не оформляют\n(кроме форс-мажора)\nП-541 п.16\nПаспорт ООН (Laissez-Passer)\nБез визы 60 дней\nП-541\nп.13-1\n«Игорная» виза\nГраждане отдельных стран — виза до 7 дней через аэропорт «Манас» или\nпортал по ходатайству лицензированного игорного заведения; перечень\nстран — совместным приказом\nП-541 п.14\nЭтнические кыргызы и их семьи,\nпревысившие сроки\nОднократный въезд для легализации — 30 рабочих дней со дня въезда\nП-541 п.13\nСупруги и несовершеннолетние дети\nграждан КР, превысившие сроки\nОднократный въезд для легализации — 30 рабочих дней при\nдокументальном подтверждении родства\nП-541 п.13\nЛица, утратившие гражданство КР или\nвышедшие из него (безвизовых стран)\nРегистрация на 90 дней для оформления документов на проживание\nПР-600 п.9\n2.6. Кому доступна e-Visa\nПортал принимает заявки от граждан всех стран (в списке стран портала — все государства, а также Макао и «UN\nEmployee»). Доступные типы визы для конкретного гражданства и документа портал показывает на шаге 1.\nОграничение по пунктам въезда. По условиям портала (страница conditions) e-Visa используется только при въезде\nчерез аэропорт «Манас», аэропорт «Ош» и КПП «Ак-Жол». В ВП-312 (п.33) перечня пунктов нет. Вторичные\nисточники (Википедия, турсайты) называют до 12 пунктов — дополнительно Иркештам, Торугарт, Ак-Тилек,\nЧалдыбар, Чон-Капка, Бор-Добо, Кулунду, Кызыл-Бель, Достук; официально это не подтверждено. Правило\n[ПРАКТИКА] : планировать въезд через Манас, Ош или Ак-Жол; другой КПП — только после письменного\nподтверждения поддержки портала (+996 703 428 865, +996 999 312 002), ответ сохранить в CRM.\nДля граждан стран без упрощённого порядка заявка проходит согласование ГКНБ (до 4 р.д. внутри общего срока;\nмолчание = согласие).\nОтдельного официального списка «стран, которым e-Visa недоступна», нет. Фактически невозможно: по\nнепризнанным паспортам; лицам с запретом на въезд; категориям, которым виза внутри КР не положена (TS/TR/R\nизнутри; Гонконг/Макао, тургруппы КНР).\n2.7. Дипломатические, служебные и официальные паспорта\nВизы D и O оформляются по дипломатическим каналам (обращение МИД иностранного государства, посольства,\nмежд. организации или госоргана КР) — не наш продукт, только консультация.\nБезвизовый въезд по дип/служебным паспортам действует для безвизовых стран и по отдельным соглашениям\n(например, КНР, Индия, Индонезия, Иран, Марокко, Туркменистан) [ПРОВЕРИТЬ на портале по конкретной стране — «Do\nI need visa?» показывает режим отдельно для обычного, служебного и дипломатического паспорта] .\nРегистрация владельцев дип/служебных паспортов, пользующихся иммунитетами, — в МИД (ПР-600 гл. 7),\nбесплатно, 1 р.д.\n2.8. Если у клиента не обычный паспорт\nДокумент\nЧто делать\nДокумент лица без гражданства\nВиза нужна; на портале — тип «Stateless persons travel document»; эскалация менеджеру\n(П-541 п.23)",
      "reason": "Full applicability conditions from section 2.5 need reviewed machine representation",
      "source": {
        "days": 7,
        "reentry_after_days": 21
      }
    },
