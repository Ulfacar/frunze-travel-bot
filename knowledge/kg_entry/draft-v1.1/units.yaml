-Жол; другой КПП — только после письменного\nподтверждения поддержки портала (+996 703 428 865, +996 999 312 002), ответ сохранить в CRM.\nДля граждан стран без упрощённого порядка заявка проходит согласование ГКНБ (до 4 р.д. внутри общего срока;\nмолчание = согласие).\nОтдельного официального списка «стран, которым e-Visa недоступна», нет. Фактически невозможно: по\nнепризнанным паспортам; лицам с запретом на въезд; категориям, которым виза внутри КР не положена (TS/TR/R\nизнутри; Гонконг/Макао, тургруппы КНР).\n2.7. Дипломатические, служебные и официальные паспорта\nВизы D и O оформляются по дипломатическим каналам (обращение МИД иностранного государства, посольства,\nмежд. организации или госоргана КР) — не наш продукт, только консультация.\nБезвизовый въезд по дип/служебным паспортам действует для безвизовых стран и по отдельным соглашениям\n(например, КНР, Индия, Индонезия, Иран, Марокко, Туркменистан) [ПРОВЕРИТЬ на портале по конкретной стране — «Do\nI need visa?» показывает режим отдельно для обычного, служебного и дипломатического паспорта] .\nРегистрация владельцев дип/служебных паспортов, пользующихся иммунитетами, — в МИД (ПР-600 гл. 7),\nбесплатно, 1 р.д.\n2.8. Если у клиента не обычный паспорт\nДокумент\nЧто делать\nДокумент лица без гражданства\nВиза нужна; на портале — тип «Stateless persons travel document»; эскалация менеджеру\n(П-541 п.23)",
