    "blocked_value": {
      "reason": "CALC-02 requires approved calculation examples",
      "source": " Как считаются дни пребывания\nОтсчёт — в календарных днях со дня пересечения границы с 00:01 (П-541 п.10).\nСчитает ЕСУВМ автоматически; дата последнего выезда — день окончания предыдущего периода. Без доступа к\nЕСУВМ — по штампам в паспорте.\nПериод скользящий: «30 дней в каждом 60-дневном периоде с момента въезда». Практическое правило для\nрасчёта [ПРАКТИКА] : на дату планируемого выезда посмотреть назад на 60 (120/180/360) дней — сумма дней в КР\nне должна превышать 30 (60/90/180).\nПример (США, 30/60): въезд 1 марта, выезд 30 марта (30 дней) → следующий безвизовый въезд возможен, когда в\nокне 60 дней останется запас дней. Безопаснее всего — повторный въезд после 30 дней отсутствия.\nПример (Россия, 90/180): был в КР 60 дней, выехал → при следующем въезде остаток 30 дней в текущем 180-\nдневном окне.\nРегистрация не продлевает безвиз-лимит. Для пребывания сверх лимита нужно основание: виза, ЕР, резидент-\nкарта, ВНЖ, регистрация по учебному/трудовому договору (для безвизовых — по ПР-600).\nТочный остаток дней клиенту не обещать по расчёту в уме: при сомнениях — запросить штампы/посадочные и\nсчитать в CRM-калькуляторе; при пограничных значениях — эскалация [ПРАКТИКА] .\n"
    },
