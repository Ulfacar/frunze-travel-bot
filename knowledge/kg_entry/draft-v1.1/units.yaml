  {
    "blocked_value": {
      "reason": "Unadapted source template; E5-04 must render from approved calculator output",
      "source": "RU: {Имя}, ваша виза готова ✅ Файл во вложении. Проверьте ФИО и номер паспорта.\n1. Распечатайте визу и сохраните в телефоне.\n2. Въезжайте по этому же паспорту № {номер}.\n3. Въезд — через аэропорт «Манас», «Ош» или КПП «Ак-Жол».\n4. Срок: с {дата} по {дата}, {однократная/многократная}. Нельзя въезжать раньше и оставаться позже.\n5. На границе называйте цель: {туризм/деловая поездка}. Работать по этой визе нельзя.\n6. Если будете в Кыргызстане дольше {N} дней — нужна регистрация до {дата}. Мы можем её сделать.\n7. Хотите продлить пребывание — напишите минимум за 10 рабочих дней до {дата окончания}. Туристическая виза\nне продлевается.\n8. Просрочка — штраф от 5 500 сом, выездная виза от $200 и запрет въезда; оплатить штраф в аэропорту нельзя.\n9. Потеряли паспорт — сразу пишите нам: {телефон}.\nEN: {Name}, your visa is ready ✅ The file is attached — please check your name and passport number.\n1. Print the visa and keep a copy on your phone.\n2. Enter with the same passport No. {number}.\n3. Entry via Manas airport, Osh airport or the Ak-Jol checkpoint.\n4. Valid from {date} to {date}, {single/multiple} entry. Do not arrive earlier or stay later.\n5. Tell the border officer your purpose: {tourism/business}. Work is not allowed on this visa.\n6. If you stay longer than {N} days, registration is required by {date} — we can do it for you.\n7. To extend your stay, contact us at least 10 working days before {end date}. Tourist visas cannot be extended.\n8. Overstay means a fine (from 5,500 KGS), an exit visa (from $200) and an entry ban; fines cannot be paid at the airport.\n9. Lost passport — contact us immediately: {phone}."
    },
