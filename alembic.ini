# Alembic configuration for the Frunze Travel / GetVisa domain schema (WP1M).
#
# IMPORTANT: this config manages ONLY the WP1A domain tables (DomainBase.metadata):
# contacts, contact_identities, requests, dialogs, assignments, external_references.
# The legacy runtime schema (deals, conversations, messages, audit_log, app_flags,
# faq_entries) stays under app.integrations.crm.db.init_models (create_all +
# _ensure_columns) and is intentionally OUT of Alembic's target_metadata.
#
# No DSN, password or secret lives here. `sqlalchemy.url` is deliberately blank:
# the database URL must be provided explicitly at run time via the
# ALEMBIC_DATABASE_URL environment variable, or `alembic -x dburl=<url>`.
# env.py never auto-loads the production .env. See alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Blank on purpose — do NOT put a DSN here. env.py resolves the URL explicitly
# from ALEMBIC_DATABASE_URL or `-x dburl=...` and refuses to guess production.
sqlalchemy.url =

[post_write_hooks]

# Logging configuration (standard alembic layout).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
