# Frunze Travel Bot — прод-стек: приложение + Postgres + Redis.
# Coolify даёт reverse-proxy + TLS поверх сервиса `app` (порт 8000), поэтому
# nginx/Let's Encrypt здесь не нужны. Секреты — из .env (см. .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Frunze Travel Bot}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-anthropic/claude-3.5-sonnet}
      LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP:-anthropic/claude-3-haiku}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-0}
      LLM_DAILY_BUDGET_SOFT_RATIO: ${LLM_DAILY_BUDGET_SOFT_RATIO:-0.8}
      LLM_HISTORY_MAX_MESSAGES: ${LLM_HISTORY_MAX_MESSAGES:-40}
      WAPPI_BASE_URL: ${WAPPI_BASE_URL:-https://wappi.pro}
      WAPPI_TOKEN: ${WAPPI_TOKEN:-}
      WAPPI_PROFILE_ID: ${WAPPI_PROFILE_ID:-}
      CAPTURE_MANAGER_ECHO: ${CAPTURE_MANAGER_ECHO:-false}
      MANAGER_SILENCE_HOURS: ${MANAGER_SILENCE_HOURS:-3}
      BOTS: ${BOTS:-[{"id":"frunze_tours","scenario":"tours","title":"FrunzeTravel2","wappi_profile_id":"02a4708d-ec6c"},{"id":"getvisa","scenario":"visa","title":"GetVisa","wappi_profile_id":"2f099bc3-478d"}]}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOTS: ${TELEGRAM_BOTS:-[]}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TOURVISOR_LOGIN: ${TOURVISOR_LOGIN:-}
      TOURVISOR_PASS: ${TOURVISOR_PASS:-}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/frunze
      REDIS_URL: redis://redis:6379/0
      CRM_BACKEND: ${CRM_BACKEND:-postgres}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      BITRIX_CATEGORY_BY_FUNNEL: ${BITRIX_CATEGORY_BY_FUNNEL:-{}}
      BITRIX_STAGE_MAP: ${BITRIX_STAGE_MAP:-{}}
      STATE_BACKEND: ${STATE_BACKEND:-redis}
      PANEL_BACKEND: ${PANEL_BACKEND:-postgres}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MANAGERS: ${MANAGERS:-[]}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-frunze-session-secret}
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      # Утренний бриф менеджеру: без этого токена джоба «отправляет» в пустоту (контейнер
      # видит ТОЛЬКО перечисленные здесь переменные — в prod.env их держать мало).
      MANAGERS_TELEGRAM_BOT_TOKEN: ${MANAGERS_TELEGRAM_BOT_TOKEN:-}
      MANAGERS_TELEGRAM_CHAT_ID: ${MANAGERS_TELEGRAM_CHAT_ID:-}
      MORNING_BRIEF_HOUR: ${MORNING_BRIEF_HOUR:-9}
      # Абсолютный префикс ссылок в брифе — иначе в Telegram уходит «/admin/...» и не кликается.
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
      # Пилот по турам: за кем закрепляем ночные лиды и на каком канале.
      TOURS_PILOT_MANAGER: ${TOURS_PILOT_MANAGER:-ademi}
      TOURS_PILOT_BOT_ID: ${TOURS_PILOT_BOT_ID:-frunze_tours}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: frunze
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frunze"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # персистентность сессий между рестартами
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
