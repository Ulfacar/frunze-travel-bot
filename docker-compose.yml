# Frunze Travel Bot — прод-стек: приложение + Postgres + Redis.
# Coolify даёт reverse-proxy + TLS поверх сервиса `app` (порт 8000), поэтому
# nginx/Let's Encrypt здесь не нужны. Секреты — из .env (см. .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Эти значения переопределяют localhost из .env — внутри сети ходим по именам сервисов.
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/frunze
      REDIS_URL: redis://redis:6379/0
      CRM_BACKEND: ${CRM_BACKEND:-postgres}
      STATE_BACKEND: ${STATE_BACKEND:-redis}
      PANEL_BACKEND: ${PANEL_BACKEND:-postgres}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: frunze
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frunze"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # персистентность сессий между рестартами
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
