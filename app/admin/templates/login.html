<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frunze — вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0c0d0e; --surface:#161718; --border:#26282c; --text:#e8e9eb;
            --muted:#8a8f98; --accent:#2dd4bf; --accent-2:#0d9488; --hot:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--text); font-family:Inter, system-ui, sans-serif; }
    .card { width:340px; background:var(--surface); border:1px solid var(--border);
            border-radius:16px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .logo { width:44px; height:44px; border-radius:12px; margin:0 auto 14px;
            background:linear-gradient(135deg,#2dd4bf,#0d9488); display:grid; place-items:center;
            color:#07201d; font-weight:800; font-size:20px; }
    h1 { font-size:18px; text-align:center; margin:0 0 4px; }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 20px; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
    input { width:100%; padding:11px 12px; background:#0f1011; border:1px solid var(--border);
            border-radius:10px; color:var(--text); font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px;
             background:linear-gradient(135deg,#2dd4bf,#0d9488); color:#07201d;
             font-weight:700; font-size:14px; cursor:pointer; }
    .err { margin-top:14px; color:var(--hot); font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <div class="logo">F</div>
    <h1>Frunze — панель менеджера</h1>
    <p class="sub">Войдите под своим логином</p>
    <label for="login">Логин</label>
    <input id="login" name="login" autocomplete="username" autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Войти</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
