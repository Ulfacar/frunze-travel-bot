name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fast-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.0.3 pytest-asyncio==1.3.0
      - name: Fast regression tests
        # Явный список ограничивает саму коллекцию, а не только исполнение после -k.
        # Настройка действует лишь в этом шаге; pytest.ini и новые маркеры не нужны.
        env:
          PYTEST_ADDOPTS: >-
            -p no:randomly
            -o "python_files=test_network_guard.py test_wappi_contract.py
            test_validator.py test_validator_safety.py test_visa_pricing.py
            test_tourvisor_query.py test_search_relaxation.py
            test_bitrix_connect_retry.py test_bitrix_error_body.py
            test_awaiting_cooldown_durable.py
            test_entry_routing_v2.py test_entry_stop_factor_work.py"
        run: |
          python - <<'PY'
          import os, shlex
          from pathlib import Path
          patterns = next(arg for arg in shlex.split(os.environ['PYTEST_ADDOPTS'])
                          if arg.startswith('python_files=')).split('=', 1)[1].split()
          for name in patterns:
              if not (Path('tests') / name).is_file():
                  raise SystemExit(f'Missing fast test file: {name}')
          PY
          python -m pytest tests -q

  prod-traps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Check new production traps
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Для создания ветки before состоит из нулей: берём предыдущий коммит.
          # Для самого первого коммита сравниваем с пустым деревом Git.
          if [[ "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE="$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree --stdin </dev/null)"
          fi
          if [[ ! "$DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Missing or invalid diff base'
            exit 1
          fi
          # Скрипт не проверяет returncode git diff: недоступная база не должна дать зелёный CI.
          git diff "$DIFF_BASE" -- app/config.py >/dev/null
          # SET_BUT_NOT_DELIVERED для ANTHROPIC_API_KEY возникает из локального .env.
          # В CI проверяем код/compose без локальных секретов; старые WARN видны в логе.
          # --strict намеренно отсутствует: он превратил бы весь старый фон в ошибки.
          python scripts/prod_traps_check.py --diff-base "$DIFF_BASE" --env-file /dev/null

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
      - name: Scan Git history for secrets
        # Бинарник не публикует комментарии/артефакты и не требует GITLEAKS_LICENSE.
        # Сканируем всю доступную историю; старые утечки тоже требуют исправления.
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact=100 --exit-code=1 --no-banner'
