# Оверлей для self-hosted VPS, где УЖЕ есть системный nginx + certbot на портах 80/443
# (сервер общий, на нём живут другие проекты). Наш стек не трогает 80/443 —
# приложение слушает только localhost:8000, а host-nginx проксирует на него
# frunzetravel.kg и держит TLS (Let's Encrypt через certbot).
#
# Запуск на сервере:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  app:
    environment:
      BITRIX_PIPELINE_ENABLED: ${BITRIX_PIPELINE_ENABLED:-false}
      BITRIX_AUTODEAL_ENABLED: ${BITRIX_AUTODEAL_ENABLED:-false}
      BITRIX_READ_BACK_DAYS: ${BITRIX_READ_BACK_DAYS:-45}
      BITRIX_STAGE_MAP: ${BITRIX_STAGE_MAP:-{}}
      BITRIX_DEAL_CATEGORY_ID: ${BITRIX_DEAL_CATEGORY_ID:-27}
      BITRIX_DEAL_STAGE_ID: ${BITRIX_DEAL_STAGE_ID:-C27:NEW}
    # Только localhost — наружу смотрит host-nginx, не сам контейнер.
    ports:
      - "127.0.0.1:8077:8000"
